<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>우리 가계부 💑</title>
<meta name="description" content="우리 둘만의 가계부">
<meta name="theme-color" content="#FF8FAB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="우리가계부">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans KR',sans-serif;background:#f8f9fa;color:#333;min-height:100vh;overflow-x:hidden}
:root{
  --pink:#FF8FAB;--blue:#89C4E1;--mint:#7DCFB6;
  --pink-light:#fff0f3;--blue-light:#eaf5fb;--mint-light:#edfaf6;
  --gray:#888;--gray-light:#f0f0f0;--white:#fff;
  --nav-h:64px;--header-h:56px;
}

/* ───── Layout ───── */
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
#header{height:var(--header-h);background:var(--white);display:flex;align-items:center;justify-content:space-between;padding:0 16px;box-shadow:0 1px 4px rgba(0,0,0,.08);z-index:100;flex-shrink:0}
#header h1{font-size:18px;font-weight:700;color:var(--pink)}
#header .header-right{display:flex;gap:8px}
#header button{background:none;border:none;font-size:20px;cursor:pointer;padding:4px}
#page-area{flex:1;overflow-y:auto;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 8px)}
#nav{height:auto;min-height:var(--nav-h);background:var(--white);display:flex;position:fixed;bottom:0;left:0;right:0;box-shadow:0 -1px 8px rgba(0,0,0,.1);z-index:100;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:none;cursor:pointer;font-size:9px;color:var(--gray);transition:.15s;padding:6px 0}
.nav-btn .nav-icon{font-size:22px;line-height:1}
.nav-btn.active{color:var(--pink)}
.nav-btn.active .nav-icon{transform:scale(1.12)}

/* ───── Pages ───── */
.page{display:none;padding:12px}
.page.active{display:block}

/* ───── Sub-tabs ───── */
.sub-tabs{display:flex;background:var(--gray-light);border-radius:12px;padding:3px;margin-bottom:12px}
.sub-tab{flex:1;text-align:center;padding:7px 4px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:500;color:var(--gray);transition:.15s}
.sub-tab.active{background:var(--white);color:var(--pink);box-shadow:0 1px 4px rgba(0,0,0,.1)}

/* ───── Month Nav ───── */
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:4px 0}
.month-nav button{background:none;border:none;font-size:22px;cursor:pointer;color:var(--gray);padding:4px 8px}
.month-nav span{font-size:17px;font-weight:700}

/* ───── Summary Card ───── */
.summary-card{background:var(--white);border-radius:16px;padding:14px 18px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.07)}
.summary-card .label{font-size:12px;color:var(--gray);margin-bottom:4px}
.summary-card .amount{font-size:22px;font-weight:700;color:var(--pink)}

/* ───── Calendar ───── */
.cal-wrap{background:var(--white);border-radius:16px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.07)}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);background:var(--gray-light)}
.cal-head span{text-align:center;padding:6px 0;font-size:11px;font-weight:700;color:var(--gray)}
.cal-head span:first-child{color:#e05555}
.cal-head span:last-child{color:var(--blue)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-cell{min-height:56px;border-top:1px solid #f0f0f0;border-right:1px solid #f0f0f0;padding:3px 3px 3px 4px;cursor:pointer;position:relative;overflow:hidden;transition:.12s}
.cal-cell:hover{background:#fafafa}
.cal-cell.empty{background:#fafafa;cursor:default}
.cal-cell:nth-child(7n){border-right:none}
.cal-day{font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%}
.cal-cell.sun .cal-day{color:#e05555}
.cal-cell.sat .cal-day{color:var(--blue)}
.cal-cell.today .cal-day{background:var(--pink);color:#fff}
.cal-preview{font-size:9px;color:var(--gray);line-height:1.35;margin-top:1px;overflow:hidden;max-height:28px;word-break:keep-all}
.cal-preview .preview-amt{font-size:9px;font-weight:700;color:var(--pink)}
.cal-preview .preview-meal{color:var(--mint);font-weight:500}
.cal-preview .preview-sched{color:var(--blue)}
.cal-preview .preview-holiday{color:#e05555;font-weight:600}
.cal-cell.holiday .cal-day{color:#e05555}

/* ───── FAB ───── */
.fab{position:fixed;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px);right:16px;width:52px;height:52px;border-radius:50%;background:var(--pink);color:#fff;border:none;font-size:26px;cursor:pointer;box-shadow:0 4px 12px rgba(255,143,171,.5);display:flex;align-items:center;justify-content:center;z-index:90;transition:.15s}
.fab:active{transform:scale(.93)}

/* ───── Modal Overlay ───── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;display:none;align-items:flex-end;justify-content:center}
.overlay.active{display:flex}
.sheet{background:var(--white);border-radius:20px 20px 0 0;width:100%;max-height:92vh;overflow-y:auto;padding:20px 16px 32px;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:36px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 16px}
.sheet h2{font-size:17px;font-weight:700;margin-bottom:14px}
.sheet h3{font-size:15px;font-weight:600;margin-bottom:8px;color:var(--gray)}

/* ───── Form Elements ───── */
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;color:var(--gray);margin-bottom:5px;font-weight:500}
.form-group input,.form-group textarea,.form-group select{width:100%;border:1.5px solid #e0e0e0;border-radius:10px;padding:10px 12px;font-size:15px;font-family:'Noto Sans KR',sans-serif;outline:none;transition:.15s;background:var(--white)}
.form-group input:focus,.form-group textarea:focus{border-color:var(--pink)}
.form-group textarea{min-height:100px;resize:vertical}

/* ───── Category Chips ───── */
.cat-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.cat-chip{border:1.5px solid #e0e0e0;background:var(--white);border-radius:20px;padding:5px 10px;font-size:12px;cursor:pointer;transition:.15s;font-family:'Noto Sans KR',sans-serif}
.cat-chip.selected{border-color:var(--pink);background:var(--pink-light);color:var(--pink);font-weight:600}

/* ───── Buttons ───── */
.btn{display:inline-flex;align-items:center;justify-content:center;border:none;border-radius:12px;padding:12px 20px;font-size:15px;font-weight:600;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:.15s;width:100%}
.btn:active{opacity:.85}
.btn-primary{background:var(--pink);color:#fff}
.btn-mint{background:var(--mint);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-gray{background:var(--gray-light);color:#555}
.btn-danger{background:#ff5a5a;color:#fff}
.btn-sm{padding:7px 14px;font-size:13px;border-radius:8px;width:auto}
.btn-row{display:flex;gap:8px;margin-top:14px}
.btn-row .btn{flex:1}

/* ───── Expense Items ───── */
.expense-list{margin-top:10px}
.exp-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f0f0}
.exp-item:last-child{border-bottom:none}
.exp-cat-icon{font-size:20px;flex-shrink:0}
.exp-info{flex:1;min-width:0}
.exp-desc{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp-cat{font-size:11px;color:var(--gray)}
.exp-amount{font-size:15px;font-weight:700;color:#333;white-space:nowrap}
.exp-del{background:none;border:none;font-size:18px;color:#ccc;cursor:pointer;padding:4px;flex-shrink:0}
.exp-del:active{color:#ff5a5a}

/* ───── Todo ───── */
.todo-input-row{display:flex;gap:8px;margin-bottom:14px}
.todo-input-row input{flex:1;border:1.5px solid #e0e0e0;border-radius:10px;padding:10px 12px;font-size:15px;font-family:'Noto Sans KR',sans-serif;outline:none}
.todo-input-row input:focus{border-color:var(--pink)}
.todo-input-row button{background:var(--pink);color:#fff;border:none;border-radius:10px;padding:10px 14px;font-size:20px;cursor:pointer}
.todo-item{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--white);border-radius:12px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.todo-check{width:22px;height:22px;border-radius:50%;border:2px solid #ddd;background:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;transition:.15s}
.todo-check.done{background:var(--mint);border-color:var(--mint);color:#fff}
.todo-text{flex:1;font-size:14px}
.todo-text.done{text-decoration:line-through;color:#aaa}
.todo-del{background:none;border:none;color:#ccc;cursor:pointer;font-size:16px;padding:4px}
.section-divider{font-size:12px;font-weight:600;color:var(--gray);margin:12px 0 8px;padding-left:4px}

/* ───── Recipes ───── */
.recipe-card{background:var(--white);border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 5px rgba(0,0,0,.06);cursor:pointer;active:opacity:.8}
.recipe-card:active{opacity:.8}
.recipe-title{font-size:15px;font-weight:700;margin-bottom:4px}
.recipe-preview{font-size:12px;color:var(--gray);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* ───── Settlement ───── */
.settle-card{background:var(--white);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.07)}
.settle-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #f5f5f5}
.settle-row:last-child{border-bottom:none}
.settle-label{font-size:14px;color:#444}
.settle-val{font-size:15px;font-weight:700}
.settle-result{background:var(--pink-light);border-radius:12px;padding:14px;margin-top:8px;text-align:center}
.settle-result .result-text{font-size:15px;font-weight:700;color:var(--pink);line-height:1.6}
.settle-done-btn{margin-top:10px}
.settled-badge{display:inline-block;background:var(--mint);color:#fff;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600}

/* ───── Setup Screen ───── */
#setup-screen{position:fixed;inset:0;background:linear-gradient(135deg,var(--pink-light) 0%,var(--blue-light) 100%);display:flex;align-items:center;justify-content:center;z-index:500;padding:24px}
.setup-box{background:var(--white);border-radius:24px;padding:28px 20px;width:100%;max-width:400px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.12)}
.setup-box h2{font-size:24px;font-weight:700;margin-bottom:8px}
.setup-box p{font-size:14px;color:var(--gray);margin-bottom:24px;line-height:1.6}
.setup-box .emoji-big{font-size:48px;margin-bottom:12px}

/* ───── Notification Toast ───── */
.toast{position:fixed;top:calc(var(--header-h)+8px);left:50%;transform:translateX(-50%) translateY(-80px);background:#333;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;z-index:1000;transition:.3s;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ───── Skeleton / Empty ───── */
.empty-msg{text-align:center;color:var(--gray);padding:32px 0;font-size:14px}

/* ───── PC Responsive ≥768px ───── */
@media (min-width:768px){
  /* Sidebar nav */
  #nav{top:0;bottom:0;left:0;right:auto;width:200px;height:auto;flex-direction:column;justify-content:flex-start;padding-top:var(--header-h);box-shadow:1px 0 8px rgba(0,0,0,.08)}
  .nav-btn{flex-direction:row;justify-content:flex-start;gap:12px;padding:14px 20px;font-size:14px;width:100%}
  .nav-btn .nav-icon{font-size:20px}
  .nav-btn.active{background:var(--pink-light);color:var(--pink)}

  /* Header + content offset */
  #header{padding-left:216px}
  #page-area{margin-left:200px;padding-bottom:20px}
  .page{max-width:880px}

  /* FAB */
  .fab{bottom:28px;right:28px}

  /* Bigger calendar cells */
  .cal-cell{min-height:88px}
  .cal-preview{font-size:11px;max-height:54px}
  .cal-day{width:28px;height:28px;font-size:13px}

  /* Centered dialog modals */
  .overlay{align-items:center}
  .sheet{border-radius:20px;max-width:520px;animation:fadeScale .2s ease}
  @keyframes fadeScale{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}

  /* Larger text elements */
  .summary-card .amount{font-size:28px}
  .month-nav span{font-size:19px}
  .sub-tab{padding:9px 12px;font-size:14px}
  .sub-tabs{margin-bottom:16px}
}

@media (min-width:1100px){
  #nav{width:220px}
  #header{padding-left:236px}
  #page-area{margin-left:220px}
  .page{max-width:960px}
}
</style>
</head>
<body>

<!-- Setup Screen -->
<div id="setup-screen">
  <div class="setup-box">
    <div class="emoji-big">💑</div>
    <h2>우리 가계부</h2>
    <p>두 사람이 함께 쓰는 가계부예요.<br>먼저 Firebase 설정을 해주세요!</p>
    <button class="btn btn-primary" onclick="openSettings()">⚙️ 설정하기</button>
  </div>
</div>

<!-- Main App -->
<div id="app" style="display:none">
  <div id="header">
    <h1>💑 우리 가계부</h1>
    <div class="header-right">
      <button onclick="openSettings()" title="설정">⚙️</button>
    </div>
  </div>

  <div id="page-area">
    <!-- 가계부 -->
    <div id="page-expense" class="page active">
      <div class="sub-tabs">
        <div class="sub-tab active" onclick="switchExpenseTab('boy',this)">🐭 주머니쥐</div>
        <div class="sub-tab" onclick="switchExpenseTab('girl',this)">👧 누나양</div>
        <div class="sub-tab" onclick="switchExpenseTab('shared',this)">🤝 공금</div>
      </div>
      <div class="month-nav">
        <button onclick="changeExpenseMonth(-1)">‹</button>
        <span id="expense-month-label"></span>
        <button onclick="changeExpenseMonth(1)">›</button>
      </div>
      <div class="summary-card">
        <div class="label">이번 달 지출</div>
        <div class="amount" id="expense-summary">₩0</div>
      </div>
      <div class="cal-wrap">
        <div class="cal-head">
          <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
        </div>
        <div class="cal-grid" id="expense-cal"></div>
      </div>
    </div>

    <!-- 급식표 -->
    <div id="page-meal" class="page">
      <div class="month-nav">
        <button onclick="changeMealMonth(-1)">‹</button>
        <span id="meal-month-label"></span>
        <button onclick="changeMealMonth(1)">›</button>
      </div>
      <div class="cal-wrap">
        <div class="cal-head">
          <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
        </div>
        <div class="cal-grid" id="meal-cal"></div>
      </div>
    </div>

    <!-- 일정표 -->
    <div id="page-schedule" class="page">
      <div class="month-nav">
        <button onclick="changeScheduleMonth(-1)">‹</button>
        <span id="schedule-month-label"></span>
        <button onclick="changeScheduleMonth(1)">›</button>
      </div>
      <div class="cal-wrap">
        <div class="cal-head">
          <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
        </div>
        <div class="cal-grid" id="schedule-cal"></div>
      </div>
    </div>

    <!-- 할 일 -->
    <div id="page-todo" class="page">
      <div class="todo-input-row">
        <input type="text" id="todo-input" placeholder="할 일 추가..." onkeydown="if(event.key==='Enter')addTodo()">
        <button onclick="addTodo()">+</button>
      </div>
      <div id="todo-active-list"></div>
      <div id="todo-done-section" style="display:none">
        <div class="section-divider">완료됨</div>
        <div id="todo-done-list"></div>
      </div>
    </div>

    <!-- 레시피 -->
    <div id="page-recipe" class="page">
      <div style="display:flex;justify-content:flex-end;margin-bottom:12px">
        <button class="btn btn-primary btn-sm" onclick="openRecipeAdd()">+ 레시피 추가</button>
      </div>
      <div id="recipe-list"></div>
    </div>

    <!-- 정산 -->
    <div id="page-settle" class="page">
      <div class="month-nav">
        <button onclick="changeSettleMonth(-1)">‹</button>
        <span id="settle-month-label"></span>
        <button onclick="changeSettleMonth(1)">›</button>
      </div>
      <div id="settle-content"></div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav id="nav">
    <button class="nav-btn active" onclick="switchPage('expense',this)">
      <span class="nav-icon">💰</span>가계부
    </button>
    <button class="nav-btn" onclick="switchPage('meal',this)">
      <span class="nav-icon">🍽️</span>급식표
    </button>
    <button class="nav-btn" onclick="switchPage('schedule',this)">
      <span class="nav-icon">📅</span>일정표
    </button>
    <button class="nav-btn" onclick="switchPage('todo',this)">
      <span class="nav-icon">✅</span>할 일
    </button>
    <button class="nav-btn" onclick="switchPage('recipe',this)">
      <span class="nav-icon">📖</span>레시피
    </button>
    <button class="nav-btn" onclick="switchPage('settle',this)">
      <span class="nav-icon">🤝</span>정산
    </button>
  </nav>

  <!-- FAB -->
  <button class="fab" id="fab" onclick="onFabClick()">+</button>
</div>

<!-- ═══════════ MODALS ═══════════ -->

<!-- Settings Modal -->
<div class="overlay" id="settings-overlay" onclick="overlayClickClose(event,'settings-overlay')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2>⚙️ 설정</h2>
    <div class="form-group">
      <label>방 코드 (두 사람 동일하게)</label>
      <input type="text" id="cfg-room" placeholder="예: mypink2024">
    </div>
    <div class="form-group">
      <label>Firebase API Key</label>
      <input type="text" id="cfg-apikey" placeholder="AIzaSy...">
    </div>
    <div class="form-group">
      <label>Auth Domain</label>
      <input type="text" id="cfg-authdomain" placeholder="xxx.firebaseapp.com">
    </div>
    <div class="form-group">
      <label>Database URL</label>
      <input type="text" id="cfg-dburl" placeholder="https://xxx-default-rtdb.firebaseio.com">
    </div>
    <div class="form-group">
      <label>Project ID</label>
      <input type="text" id="cfg-projectid" placeholder="my-project-id">
    </div>
    <div class="btn-row">
      <button class="btn btn-gray" onclick="closeModal('settings-overlay')">취소</button>
      <button class="btn btn-primary" onclick="saveSettings()">저장</button>
    </div>
  </div>
</div>

<!-- Expense Detail Modal -->
<div class="overlay" id="exp-detail-overlay" onclick="overlayClickClose(event,'exp-detail-overlay')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2 id="exp-detail-title"></h2>
    <div id="exp-detail-list" class="expense-list"></div>
    <button class="btn btn-primary" style="margin-top:14px" onclick="openExpenseAdd()">+ 추가</button>
  </div>
</div>

<!-- Expense Add Modal -->
<div class="overlay" id="exp-add-overlay" onclick="overlayClickClose(event,'exp-add-overlay')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2>지출 추가</h2>
    <div class="form-group">
      <label>내용</label>
      <input type="text" id="exp-desc" placeholder="예: 점심 김치찌개">
    </div>
    <div class="form-group">
      <label>금액 (원)</label>
      <input type="number" id="exp-amount" placeholder="0" inputmode="numeric">
    </div>
    <div class="form-group">
      <label>카테고리</label>
      <div class="cat-chips" id="cat-chips">

// ══════════════════════════════════════════════
//  Calendar Builder
// ══════════════════════════════════════════════
function buildCalendar(containerId, year, month, getCellContent, onDayClick, getExtraClass) {
  const container = document.getElementById(containerId);
  const today = new Date();
  const firstDay = new Date(year, month - 1, 1).getDay();
  const daysInMonth = new Date(year, month, 0).getDate();
  let html = '';

  for (let i = 0; i < firstDay; i++) {
    html += '<div class="cal-cell empty"></div>';
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dow = (firstDay + d - 1) % 7;
    const isToday = today.getFullYear()===year && today.getMonth()+1===month && today.getDate()===d;
    const sunClass = dow === 0 ? 'sun' : '';
    const satClass = dow === 6 ? 'sat' : '';
    const todayClass = isToday ? 'today' : '';
    const extraClass = getExtraClass ? getExtraClass(d) : '';
    const content = getCellContent(d);
    html += `<div class="cal-cell ${sunClass} ${satClass} ${todayClass} ${extraClass}" onclick="${onDayClick}(event,${d})">
      <div class="cal-day">${d}</div>
      ${content ? `<div class="cal-preview">${content}</div>` : ''}
    </div>`;
  }

  container.innerHTML = html;
}

function ym(year, month) {
  return `${year}-${String(month).padStart(2,'0')}`;
}

function fmt(n) {
  return '₩' + Number(n).toLocaleString();
}

function changeExpenseMonth(delta) {

}

function renderExpenseCal() {
  const label = `${expenseYear}년 ${expenseMonth}월`;
  document.getElementById('expense-month-label').textContent = label;

  const key = ym(expenseYear, expenseMonth);
  const tabData = (appData.expenses || {})[expenseTab] || {};
  const monthData = tabData[key] || {};

  // Calc total
  let total = 0;
  Object.values(monthData).forEach(dayItems => {
    if (typeof dayItems === 'object') {
      Object.values(dayItems).forEach(item => { total += Number(item.amount || 0); });
    }
  });
  document.getElementById('expense-summary').textContent = fmt(total);

  buildCalendar('expense-cal', expenseYear, expenseMonth, (d) => {
    const dayStr = String(d).padStart(2,'0');
    const items = monthData[dayStr] || {};
    const arr = Object.values(items);
    if (!arr.length) return '';
    const dayTotal = arr.reduce((s,i) => s + Number(i.amount||0), 0);
    const previews = arr.slice(0,2).map(i => `<span>${i.desc||''}</span>`).join(' ');
    return `${previews}<br><span class="preview-amt">${fmt(dayTotal)}</span>`;
  }, 'onExpenseDayClick');
}

    .catch(e => showToast('저장 실패: ' + e.message));
}

function deleteSchedule(dayStr, id) {
  if (!confirm('이 일정을 삭제할까요?')) return;
  const key = ym(scheduleYear, scheduleMonth);
  db.ref(`${room}/schedule/${key}/${dayStr}/${id}`).remove()
    .then(() => { showToast('삭제했어요'); onScheduleDayClick(null, Number(dayStr)); });
}

// ══════════════════════════════════════════════
//  Todo Tab
// ══════════════════════════════════════════════
function renderTodos() {
  const todos = appData.todos || {};
  const arr = Object.entries(todos).sort((a,b) => (a[1].order||0)-(b[1].order||0));
  const active = arr.filter(([,t]) => !t.done);
  const done = arr.filter(([,t]) => t.done);

  document.getElementById('todo-active-list').innerHTML =
    active.length ? active.map(([id,t]) => todoHtml(id,t)).join('') :
    '<div class="empty-msg">할 일이 없어요 🎉</div>';

  const doneSection = document.getElementById('todo-done-section');
  if (done.length) {
    document.getElementById('todo-done-list').innerHTML = done.map(([id,t]) => todoHtml(id,t)).join('');
    doneSection.style.display = 'block';
  } else {
    doneSection.style.display = 'none';
  }
}

function todoHtml(id, t) {
  return `<div class="todo-item">
    <div class="todo-check ${t.done?'done':''}" onclick="toggleTodo('${id}',${!t.done})">${t.done?'✓':''}</div>
    <div class="todo-text ${t.done?'done':''}">${escHtml(t.text||'')}</div>
    <button class="todo-del" onclick="deleteTodo('${id}')">✕</button>
  </div>`;
}

function addTodo() {
  const input = document.getElementById('todo-input');
  const text = input.value.trim();
  if (!text) return;
  const todos = appData.todos || {};
  const maxOrder = Object.values(todos).reduce((m,t) => Math.max(m,t.order||0), 0);
  db.ref(`${room}/todos`).push({ text, done: false, order: maxOrder+1 })
    .then(() => { input.value = ''; showToast('할 일 추가! ✅'); })
    .catch(e => showToast('저장 실패: ' + e.message));
}

function toggleTodo(id, done) {
  db.ref(`${room}/todos/${id}`).update({ done });
}

function deleteTodo(id) {
  db.ref(`${room}/todos/${id}`).remove();
}

// ══════════════════════════════════════════════
//  Recipe Tab
// ══════════════════════════════════════════════
function renderRecipes() {
  const recipes = appData.recipes || {};
  const arr = Object.entries(recipes).sort((a,b) => (b[1].ts||0)-(a[1].ts||0));
  const list = document.getElementById('recipe-list');
  if (!arr.length) {
    list.innerHTML = '<div class="empty-msg">레시피가 없어요 🍳<br>+ 버튼으로 추가해보세요</div>';
    return;
  }
  list.innerHTML = arr.map(([id,r]) => `
    <div class="recipe-card" onclick="openRecipeEdit('${id}')">
      <div class="recipe-title">${escHtml(r.title||'')}</div>
      <div class="recipe-preview">${escHtml(r.content||'').replace(/\n/g,' ')}</div>
    </div>
  `).join('');
}

function openRecipeAdd() {
  editingRecipeId = null;
  document.getElementById('recipe-modal-title').textContent = '레시피 추가';
  document.getElementById('recipe-title-input').value = '';
  document.getElementById('recipe-content-input').value = '';
  document.getElementById('recipe-del-btn').style.display = 'none';
  openModal('recipe-overlay');
}

function openRecipeEdit(id) {
  editingRecipeId = id;
  const r = (appData.recipes || {})[id] || {};
  document.getElementById('recipe-modal-title').textContent = '레시피 수정';
  document.getElementById('recipe-title-input').value = r.title || '';
  document.getElementById('recipe-content-input').value = r.content || '';
  document.getElementById('recipe-del-btn').style.display = 'inline-flex';
  openModal('recipe-overlay');
}

function saveRecipe() {
  const title = document.getElementById('recipe-title-input').value.trim();
  const content = document.getElementById('recipe-content-input').value.trim();
  if (!title) { showToast('제목을 입력해주세요'); return; }
  const data = { title, content, ts: Date.now() };
  const ref = editingRecipeId
    ? db.ref(`${room}/recipes/${editingRecipeId}`)
    : db.ref(`${room}/recipes`).push();
  (editingRecipeId ? ref.set(data) : ref.set(data))
    .then(() => { closeModal('recipe-overlay'); showToast(editingRecipeId?'수정했어요 ✏️':'레시피 추가! 🍳'); })
    .catch(e => showToast('저장 실패: ' + e.message));
}

function deleteRecipe() {
  if (!editingRecipeId) return;
  if (!confirm('이 레시피를 삭제할까요?')) return;
  db.ref(`${room}/recipes/${editingRecipeId}`).remove()
    .then(() => { closeModal('recipe-overlay'); showToast('삭제했어요'); });
}

// ══════════════════════════════════════════════
//  Settlement Tab
// ══════════════════════════════════════════════
function changeSettleMonth(delta) {
  settleMonth += delta;
  if (settleMonth > 12) { settleMonth = 1; settleYear++; }
  if (settleMonth < 1) { settleMonth = 12; settleYear--; }
  renderSettle();
}

function renderSettle() {
  document.getElementById('settle-month-label').textContent = `${settleYear}년 ${settleMonth}월`;
  const key = ym(settleYear, settleMonth);
  const expenses = appData.expenses || {};
  const settlementData = (appData.settlements || {})[key] || {};

  function sumMonth(tab, catFilter) {
    const tabData = (expenses[tab] || {})[key] || {};
    let total = 0;
    Object.values(tabData).forEach(dayItems => {
      if (typeof dayItems === 'object') {
        Object.values(dayItems).forEach(item => {
          if (!catFilter || item.cat === catFilter) total += Number(item.amount||0);
        });
      }
    });
    return total;
  }

  const boyTotal = sumMonth('boy');
  const girlTotal = sumMonth('girl');
  const sharedTotal = sumMonth('shared');
  const coupangTotal = sumMonth('shared', '쿠팡카드');
  const sharedOther = sharedTotal - coupangTotal;
  const grandTotal = boyTotal + girlTotal + sharedTotal;

  // Shared (including Coupang card) split 50/50
  const sharedEach = Math.round(sharedTotal / 2);
  const coupangEach = Math.round(coupangTotal / 2);

  // Net transfer based on personal expense difference + shared burden
  const diff = boyTotal - girlTotal;
  let transferAmt = Math.round(Math.abs(diff) / 2) + sharedEach;
  let transferMsg = '';
  if (transferAmt < 100) {
    transferMsg = '정산 금액이 거의 없어요! 👏';
  } else if (diff > 0) {
    transferMsg = `누나양이 주머니쥐에게\n${fmt(transferAmt)} 보내주세요`;
  } else {
    transferMsg = `주머니쥐가 누나양에게\n${fmt(transferAmt)} 보내주세요`;
  }

  const settled = settlementData.settled || false;

  document.getElementById('settle-content').innerHTML = `
    <div class="settle-card">
      <div class="settle-row"><span class="settle-label">🐭 주머니쥐 지출</span><span class="settle-val">${fmt(boyTotal)}</span></div>
      <div class="settle-row"><span class="settle-label">👧 누나양 지출</span><span class="settle-val">${fmt(girlTotal)}</span></div>
      <div class="settle-row"><span class="settle-label">🤝 공금 지출</span><span class="settle-val">${fmt(sharedOther)}</span></div>
      <div class="settle-row"><span class="settle-label">💳 쿠팡카드 결제</span><span class="settle-val">${fmt(coupangTotal)}</span></div>
      <div class="settle-row" style="font-weight:700"><span class="settle-label">합계</span><span class="settle-val">${fmt(grandTotal)}</span></div>
    </div>
    <div class="settle-card">
      <h3>공금 분담 (50:50)</h3>
      <div class="settle-row"><span class="settle-label">공금 각자 부담</span><span class="settle-val">${fmt(sharedEach)}</span></div>
      ${coupangTotal > 0 ? `<div class="settle-row"><span class="settle-label" style="font-size:12px;color:var(--gray)">└ 쿠팡카드 각자 ${fmt(coupangEach)} 포함</span><span class="settle-val" style="font-size:12px;color:var(--gray)">1/2씩</span></div>` : ''}
    </div>
    <div class="settle-card">
      <h3>정산 결과</h3>
      <div class="settle-result">
        <div class="result-text" style="white-space:pre-line">${transferMsg}</div>
      </div>
      <div class="settle-done-btn">
        ${settled
          ? `<div style="text-align:center;padding:8px"><span class="settled-badge">✓ 정산 완료</span></div>
             <button class="btn btn-gray" onclick="toggleSettle(false)">정산 취소</button>`
          : `<button class="btn btn-mint" onclick="toggleSettle(true)">✅ 정산 완료</button>`
        }
      </div>
    </div>
  `;
}

function toggleSettle(done) {
  const key = ym(settleYear, settleMonth);
  db.ref(`${room}/settlements/${key}`).set({ settled: done })
    .then(() => showToast(done ? '정산 완료! 🎉' : '정산을 취소했어요'));
}

// ══════════════════════════════════════════════
//  Modal Helpers
// ══════════════════════════════════════════════
function openModal(id) {
  document.getElementById(id).classList.add('active');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}
function overlayClickClose(event, id) {
  if (event.target === document.getElementById(id)) closeModal(id);
}

// ══════════════════════════════════════════════
//  Toast
// ══════════════════════════════════════════════
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

// ══════════════════════════════════════════════
//  Utility
// ══════════════════════════════════════════════
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ══════════════════════════════════════════════
//  Kick off
// ══════════════════════════════════════════════
init();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>
